name: Trivy scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: master
  workflow_dispatch: 
  schedule:
    - cron: "0 20 * * 2"

jobs:
  trivy:
    name: trivy/depcheck
    runs-on: ubuntu-latest
    container:
      image: aquasec/trivy
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy fullscan
        run: trivy fs --pkg-types library --scanners vuln --ignore-unfixed --format sarif -o trivy_scan.sarif --severity MEDIUM,HIGH,CRITICAL .
      
      - name: Upload reports
        uses: actions/upload-artifact@master
        with:
           name: ${{ github.event.repository.name }} Trivy Scan report
           path: ${{ github.workspace }}/trivy_scan.*

      - name: Import Sarif to Sonar
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.sarifReportPaths=results.sarif
            -Dsonar.sources=${{ github.workspace }}/trivy_scan.sarif
